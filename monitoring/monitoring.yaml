apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    chart: kube-prometheus-stack
    repoURL: https://prometheus-community.github.io/helm-charts/prometheus
    targetRevision: 67.8.0
  destination:
    server: "https://kubernetes.default.svc"
    namespace: monitoring